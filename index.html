<!DOCTYPE html>
<html lang="ru" data-theme="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Расписание уроков</title>

  <meta name="theme-color" content="#0d0d0f" id="metaTheme">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Расписание">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <!-- Фон с анимациями. Внутри 3 слоя, каждая тема использует их по-своему -->
  <div class="bg" aria-hidden="true">
    <span class="bg__a"></span>
    <span class="bg__b"></span>
    <span class="bg__c"></span>
  </div>

  <div class="page">

    <!-- ===================== ВКЛАДКА 1: РАСПИСАНИЕ ===================== -->
    <main class="view" id="view-schedule" role="tabpanel">
      <h1 class="title">Расписание</h1>

      <section class="times" aria-labelledby="timesTitle">
        <h2 class="section-title" id="timesTitle">Начало первого урока</h2>
        <!-- Кнопки времени создаёт script.js из списка START_TIMES -->
        <div class="time-buttons" id="timeButtons" role="group" aria-label="Время начала первого урока"></div>
      </section>

      <section class="card" id="statusCard" data-state="before" aria-live="off">
        <div class="card__top">
          <span class="card__label" id="statusLabel">Загрузка…</span>
          <span class="card__clock" id="clock">--:--:--</span>
        </div>
        <div class="card__count" id="countdown">--:--</div>
        <p class="card__caption" id="caption">&nbsp;</p>
        <div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar__fill" id="progressFill"></div>
        </div>
        <p class="card__next" id="nextText">Дальше: …</p>
      </section>

      <section aria-labelledby="listTitle">
        <h2 class="section-title" id="listTitle">Расписание дня</h2>
        <ol class="list" id="scheduleList"></ol>
      </section>
    </main>

    <!-- ===================== ВКЛАДКА 2: НАСТРОЙКИ ===================== -->
    <main class="view" id="view-settings" role="tabpanel" hidden>
      <h1 class="title">Настройки</h1>

      <section aria-labelledby="themesTitle">
        <h2 class="section-title" id="themesTitle">Тема оформления</h2>

        <div class="themes" id="themes" role="group" aria-label="Выбор темы">
          <button class="theme-btn" type="button" data-theme="mono">
            <span class="theme-btn__sw" aria-hidden="true"></span>
            <span class="theme-btn__text">
              <span class="theme-btn__name">Чёрно-серая</span>
              <span class="theme-btn__desc">Строгая и минималистичная</span>
            </span>
            <span class="theme-btn__check" aria-hidden="true">✓</span>
          </button>

          <button class="theme-btn" type="button" data-theme="neon">
            <span class="theme-btn__sw" aria-hidden="true"></span>
            <span class="theme-btn__text">
              <span class="theme-btn__name">Фиолетово-неоновая</span>
              <span class="theme-btn__desc">Свечение и неон</span>
            </span>
            <span class="theme-btn__check" aria-hidden="true">✓</span>
          </button>

          <button class="theme-btn" type="button" data-theme="redblue">
            <span class="theme-btn__sw" aria-hidden="true"></span>
            <span class="theme-btn__text">
              <span class="theme-btn__name">Красно-синяя</span>
              <span class="theme-btn__desc">Контрастная и энергичная</span>
            </span>
            <span class="theme-btn__check" aria-hidden="true">✓</span>
          </button>

          <button class="theme-btn" type="button" data-theme="ghoul">
            <span class="theme-btn__sw" aria-hidden="true"></span>
            <span class="theme-btn__text">
              <span class="theme-btn__name">Токийский гуль</span>
              <span class="theme-btn__desc">Мрачная, с красными акцентами</span>
            </span>
            <span class="theme-btn__check" aria-hidden="true">✓</span>
          </button>

          <button class="theme-btn" type="button" data-theme="chrome">
            <span class="theme-btn__sw" aria-hidden="true"></span>
            <span class="theme-btn__text">
              <span class="theme-btn__name">Хромовая</span>
              <span class="theme-btn__desc">Металлический блеск и блики</span>
            </span>
            <span class="theme-btn__check" aria-hidden="true">✓</span>
          </button>
        </div>
      </section>

      <section class="settings-group" aria-labelledby="fxTitle">
        <h2 class="section-title" id="fxTitle">Производительность</h2>

        <button class="switch-row" type="button" id="fxToggle" role="switch" aria-checked="true">
          <span class="switch-row__text">
            <span class="switch-row__title">Анимации и эффекты</span>
            <span class="switch-row__hint">Выключи, если телефон тормозит</span>
          </span>
          <span class="switch" aria-hidden="true"></span>
        </button>
      </section>

      <p class="foot">Выбор времени и темы сохраняется на этом устройстве</p>
    </main>

  </div>

  <!-- Нижняя панель вкладок -->
  <nav class="tabbar" id="tabbar" role="tablist" aria-label="Разделы">
    <div class="tabbar__inner">
      <button class="tab-btn" type="button" role="tab" data-tab="schedule" aria-selected="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="9"/>
          <path d="M12 7v5l3 2"/>
        </svg>
        <span>Расписание</span>
      </button>
      <button class="tab-btn" type="button" role="tab" data-tab="settings" aria-selected="false">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M19 7h1M4 17h1M10 17h10"/>
          <circle cx="16.5" cy="7" r="2.5"/>
          <circle cx="7.5" cy="17" r="2.5"/>
        </svg>
        <span>Настройки</span>
      </button>
    </div>
  </nav>

</body>
</html>
