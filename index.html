<!DOCTYPE html>
<html lang="ru" data-theme="mono">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Расписание уроков</title>

  <meta name="theme-color" content="#0d0d0f" id="metaTheme">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Расписание">

  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script src="./script.js" defer></script>
</head>
<body>

  <!-- Фон с анимациями. Внутри 3 слоя, каждая тема использует их по-своему -->
  <div class="bg" aria-hidden="true">
    <span class="bg__a"></span>
    <span class="bg__b"></span>
    <span class="bg__c"></span>
  </div>

  <div class="page">

    <header class="top">
      <h1 class="title">Расписание</h1>

      <div class="corner">
        <div class="themes" id="themes" role="group" aria-label="Выбор темы">
          <button class="theme-btn" type="button" data-theme="mono"    aria-label="Тема: чёрно-серая"        title="Чёрно-серая"></button>
          <button class="theme-btn" type="button" data-theme="neon"    aria-label="Тема: фиолетово-неоновая" title="Фиолетово-неоновая"></button>
          <button class="theme-btn" type="button" data-theme="redblue" aria-label="Тема: красно-синяя"       title="Красно-синяя"></button>
          <button class="theme-btn" type="button" data-theme="ghoul"   aria-label="Тема: токийский гуль"     title="Токийский гуль"></button>
          <button class="theme-btn" type="button" data-theme="chrome"  aria-label="Тема: хромовая"           title="Хромовая"></button>
        </div>
        <button class="fx-btn" type="button" id="fxToggle" aria-pressed="true" title="Включить или выключить эффекты">✨ Вкл</button>
      </div>
    </header>

    <main>
      <section class="times" aria-labelledby="timesTitle">
        <h2 class="section-title" id="timesTitle">Начало первого урока</h2>
        <!-- Кнопки времени создаёт script.js из списка START_TIMES -->
        <div class="time-buttons" id="timeButtons" role="group" aria-label="Время начала первого урока"></div>
      </section>

      <section class="card" id="statusCard" data-state="before" aria-live="off">
        <div class="card__top">
          <span class="card__label" id="statusLabel">Загрузка…</span>
          <span class="card__clock" id="clock">--:--:--</span>
        </div>
        <div class="card__count" id="countdown">--:--</div>
        <p class="card__caption" id="caption">&nbsp;</p>
        <div class="bar" id="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar__fill" id="progressFill"></div>
        </div>
        <p class="card__next" id="nextText">Дальше: …</p>
      </section>

      <section aria-labelledby="listTitle">
        <h2 class="section-title" id="listTitle">Расписание дня</h2>
        <ol class="list" id="scheduleList"></ol>
      </section>
    </main>

    <footer class="foot">Выбор времени и темы сохраняется на этом устройстве</footer>
  </div>

</body>
</html>
