<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="theme-color" content="#0b0b0d" id="metaTheme">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Расписание</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">

<body>

<div class="bg" aria-hidden="true">
  <div class="bg__layer bg__a"></div>
  <div class="bg__layer bg__b"></div>

  <!-- ГУЛЬ: глаз -->

          <stop offset="0" stop-color="#220000"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>
        <clipPath id="eyeClip"><path d="M10 130 Q200 -40 390 130 Q200 300 10 130Z"/></clipPath>
      </defs>

      <g class="eye__veins" fill="none" stroke="#8a0000" stroke-linecap="round">

        <path stroke-width="2.5" d="M270 200 C290 225 315 245 350 265"/>
        <path stroke-width="2" d="M200 46 C198 20 205 0 200 -25"/>
        <path stroke-width="2" d="M200 214 C204 240 196 262 202 285"/>
      </g>

      <g class="eye__ball">
        <path d="M10 130 Q200 -40 390 130 Q200 300 10 130Z" fill="url(#gSclera)" stroke="#c40000" stroke-width="3.5"/>
        <g clip-path="url(#eyeClip)">
          <g class="eye__iris">
            <circle cx="200" cy="130" r="84" fill="url(#gIris)"/>
            <circle cx="200" cy="130" r="58" fill="none" stroke="#ff9a8a" stroke-opacity=".45" stroke-width="46" stroke-dasharray="1.6 7.4"/>
            <circle cx="200" cy="130" r="40" fill="none" stroke="#7a0000" stroke-opacity=".5" stroke-width="30" stroke-dasharray="1.2 5"/>
            <circle cx="200" cy="130" r="83" fill="none" stroke="#2a0000" stroke-width="4"/>
          </g>
          <ellipse class="eye__pupil" cx="200" cy="130" rx="11" ry="76" fill="#000"/>
          <ellipse cx="170" cy="92" rx="14" ry="8" fill="#fff" opacity=".55" transform="rotate(-30 170 92)"/>
          <circle cx="232" cy="165" r="4.5" fill="#fff" opacity=".4"/>
        </g>
      </g>

      <path d="M-5 120 Q200 -75 405 120" fill="none" stroke="#3a0000" stroke-width="5" opacity=".8"/>
      <path class="eye__drip" d="M147 205 h6 v36 a3 3 0 0 1 -6 0Z" fill="#b00000"/>
    </svg>
  </div>

  <div class="bg__vig"></div>

        <ellipse cx="30" cy="144" rx="10" ry="16"/>
        <line x1="30" y1="162" x2="30" y2="190" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="30" cy="208" rx="10" ry="16"/>
        <line x1="30" y1="226" x2="30" y2="254" stroke-width="8" stroke-linecap="round"/>

        <path d="M22 288 L38 288 L30 326Z" fill="#8a0010" stroke="none"/>
      </g>
    </svg>

      <defs>
        <linearGradient id="gK" x1="0" y1="1" x2="0" y2="0">

          <stop offset=".6" stop-color="#a30012"/>

  </div>

  <!-- ГУЛЬ: правая сторона -->
  <div class="bg__side bg__side--r">
    <svg class="side__chain" viewBox="0 0 60 330" xmlns="http://www.w3.org/2000/svg">
      <g class="chain__g" fill="none" stroke="#9c2a33" stroke-width="5">
        <ellipse cx="30" cy="16" rx="10" ry="16"/>
        <line x1="30" y1="34" x2="30" y2="62" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="30" cy="80" rx="10" ry="16"/>
        <line x1="30" y1="98" x2="30" y2="126" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="30" cy="144" rx="10" ry="16"/>
        <line x1="30" y1="162" x2="30" y2="190" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="30" cy="208" rx="10" ry="16"/>
        <line x1="30" y1="226" x2="30" y2="254" stroke-width="8" stroke-linecap="round"/>
        <ellipse cx="30" cy="272" rx="10" ry="16"/>

    <svg class="side__kagune" viewBox="0 0 120 300" xmlns="http://www.w3.org/2000/svg">

      <path class="k k2" d="M28 300 C44 230 72 180 114 138 C96 190 96 245 106 300Z" fill="url(#gK2)" stroke="#ff4d4d" stroke-width="1.2"/>
      <path class="k k3" d="M0 300 C0 250 8 200 26 150 C26 205 36 255 42 300Z" fill="url(#gK2)" stroke="#ff4d4d" stroke-width="1.2"/>
    </svg>
  </div>

  <div class="bg__kanji bg__kanji--l">東京</div>
  <div class="bg__kanji bg__kanji--r">喰種</div>
  <div class="bg__embers"></div>

  <!-- ТАКИДЗАВА -->

      <path d="M160 330 L160 395 Q200 425 240 395 L240 330Z" fill="#d8c0bd"/>
      <path d="M160 370 Q200 395 240 370 L240 330 L160 330Z" fill="#000" opacity=".12"/>
      <path d="M108 190 C108 300 150 372 200 378 C250 372 292 300 292 190 C292 120 250 96 200 96 C150 96 108 120 108 190Z" fill="#e8d3cf"/>
      <path d="M138 205 L182 214" stroke="#cfc9e6" stroke-width="5" stroke-linecap="round"/>
      <path d="M262 205 L218 214" stroke="#cfc9e6" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="160" cy="232" rx="20" ry="11" fill="#fff"/>
      <circle cx="160" cy="232" r="8" fill="#3b2a52"/>
      <circle cx="160" cy="232" r="3.5" fill="#000"/>
      <ellipse cx="240" cy="232" rx="21" ry="12" fill="#000"/>
      <g class="tk__kakugan">
        <circle cx="240" cy="232" r="9.5" fill="url(#gKk)"/>
        <ellipse cx="240" cy="232" rx="2" ry="8" fill="#000"/>
      </g>
      <path d="M262 232 l12 -6 M262 237 l12 4 M218 238 l-8 6" stroke="#7a0000" stroke-width="2" stroke-linecap="round"/>
      <path d="M132 190 L190 210" stroke="#b86a7a" stroke-width="4" stroke-linecap="round"/>
      <path d="M144 184 v14 M157 189 v14 M170 194 v14 M183 199 v14" stroke="#5a2a3a" stroke-width="2.5" stroke-linecap="round"/>

        <path d="M150 74 L160 34 M200 62 L204 16 M250 74 L242 34" stroke="#c8c2e4" stroke-width="3" fill="none" stroke-linecap="round"/>
      </g>
    </svg>
  </div>
</div>

<main class="app">

  <section class="view is-active" id="view-schedule" aria-label="Расписание">
    <h1>Расписание</h1>
    <p class="sub">Во сколько начинается 1 урок?</p>

    <div class="chips" id="timeButtons"></div>

    <form class="addform" id="addTimeForm" hidden>
      <input type="time" id="customTimeInput" required aria-label="Своё время">
      <button class="btn" type="submit">Добавить</button>
      <button class="btn btn--ghost" type="button" id="customTimeCancel">Отмена</button>
    </form>

    <section class="card status" id="statusCard" data-mode="before">
      <div class="status__top">
        <span class="status__label" id="statusLabel">…</span>
        <span class="status__clock" id="clock">--:--</span>
      </div>
      <div class="status__count" id="countdown">--:--</div>
      <div class="status__caption" id="caption"></div>
      <div class="progress" id="progress"><div class="progress__fill" id="progressFill"></div></div>
      <div class="status__next" id="nextText"></div>
    </section>

    <ol class="list" id="scheduleList"></ol>
  </section>

  <section class="view" id="view-settings" aria-label="Настройки">
    <h1>Настройки</h1>

    <h2>Длительности</h2>
    <div class="card" id="stepperList"></div>
    <button class="btn btn--ghost wide" type="button" id="resetCfg">Сбросить по умолчанию</button>

    <h2>Свои времена</h2>
    <div class="card">
      <p class="hint" id="customEmpty">Пока нет. Нажми «+» рядом с кнопками времени.</p>
      <ul class="list" id="customList"></ul>
    </div>

    <h2>Тема</h2>
    <div class="themes" id="themes"></div>

    <h2>Эффекты</h2>
    <div class="card switchrow">
      <div>
        <div class="switch__t">Анимации на фоне</div>
        <div class="hint">Выключи, если телефон тормозит</div>
      </div>
      <button class="switch" id="fxToggle" type="button" role="switch" aria-checked="true" aria-label="Анимации на фоне"></button>
    </div>
  </section>

</main>

<nav class="tabbar" id="tabbar">
  <button class="tab is-active" type="button" data-tab="schedule">Расписание</button>
  <button class="tab" type="button" data-tab="settings">Настройки</button>
</nav>

<script src="./script.js" defer></script>
</body>
</html>
